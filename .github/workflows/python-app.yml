name: Regresiones offline de especialistas

on:
  push:
    branches: ["fix/cierre-pb02"]
  pull_request:
    branches: ["develop"]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      PYTHON_DOTENV_DISABLED: "1"
      ESPECIALISTAS_MODO: "reglas"
      SUPERVISOR_MODE: "reglas"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"

    steps:
      - name: Descargar código
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Instalar dependencias del proyecto
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Ejecutar regresiones sin integración real
        run: |
          python -m pytest -q -p no:cacheprovider \
            -m "not integration" \
            tests/test_especialistas_llm.py \
            tests/test_regresion_planificacion_llm.py \
            tests/test_node_documental.py \
            tests/test_instalaciones_hora.py \
            tests/test_nodo_instalaciones.py
