<text x="1045" y="714" font-family="Arial, sans-serif" font-size="18" fill="#233c55">Implementación determinista</text>
<text x="1045" y="741" font-family="Arial, sans-serif" font-size="18" fill="#233c55">Respuesta + plan informativo</text>
<text x="1045" y="768" font-family="Arial, sans-serif" font-size="18" fill="#233c55">Conserva fuentes y limitaciones</text>
<text x="1045" y="795" font-family="Arial, sans-serif" font-size="18" fill="#233c55">No aprueba ni cierra</text>
