<rect width="1500" height="1600" fill="#f5f8fc"/>

<text x="55" y="55" font-family="Arial, sans-serif" font-size="32" fill="#233c55" font-weight="700">Supervisor y grafo: del pedido a la decisión</text>
<text x="55" y="90" font-family="Arial, sans-serif" font-size="18" fill="#233c55">Montaje #22 + #23 · 25/10/2026 · síncrono · aceptación con servicios reales pendiente</text>
<rect x="65" y="130" width="610" height="112" rx="14" fill="#e5f4ed" stroke="#5e9c7d" stroke-width="2"/>
<text x="85" y="163" font-family="Arial, sans-serif" font-size="22" fill="#233c55" font-weight="700">CLI · conectada a runtime</text>
<text x="85" y="194" font-family="Arial, sans-serif" font-size="19" fill="#233c55">Consultas, fuentes, debug y decisión HITL</text>
<text x="85" y="222" font-family="Arial, sans-serif" font-size="19" fill="#233c55">crear_servicio(modo=real)</text>
<rect x="825" y="130" width="610" height="112" rx="14" fill="#e5f4ed" stroke="#5e9c7d" stroke-width="2"/>
<text x="845" y="163" font-family="Arial, sans-serif" font-size="22" fill="#233c55" font-weight="700">Streamlit · conectado a runtime</text>
<text x="845" y="194" font-family="Arial, sans-serif" font-size="19" fill="#233c55">Chat, fuentes, avisos por estado y decisión HITL</text>
<text x="845" y="222" font-family="Arial, sans-serif" font-size="19" fill="#233c55">JPG/PNG guardado; image_id aún no llega al agente</text>
