<text x="845" y="1123" font-family="Arial, sans-serif" font-size="22" fill="#233c55" font-weight="700">Decisión humana desde CLI / Streamlit</text>
<text x="845" y="1154" font-family="Arial, sans-serif" font-size="18" fill="#233c55">resolver_plan(hilo, bool, plan_id=...)</text>
<text x="845" y="1181" font-family="Arial, sans-serif" font-size="18" fill="#233c55">update_state + invoke(None), mismo hilo</text>
<path d="M825 1140 H745" fill="none" stroke="#43627e" stroke-width="2.8"/>
<polygon points="745.0,1140.0 757.0,1134.0 757.0,1146.0" fill="#43627e"/>
<rect x="380" y="1090" width="365" height="102" rx="14" fill="#e5f4ed" stroke="#5e9c7d" stroke-width="2"/>
<text x="400" y="1123" font-family="Arial, sans-serif" font-size="22" fill="#233c55" font-weight="700">Aplicar → END</text>
<text x="400" y="1154" font-family="Arial, sans-serif" font-size="18" fill="#233c55">Aprobar: done=True</text>
<text x="400" y="1181" font-family="Arial, sans-serif" font-size="18" fill="#233c55">Rechazar: done=False</text>
<text x="55" y="956" font-family="Arial, sans-serif" font-size="23" fill="#233c55" font-weight="700">Controles importantes</text>
<text x="55" y="991" font-family="Arial, sans-serif" font-size="18" fill="#233c55">• FINISH sin plan válido → sintetizar.</text>
<text x="55" y="1018" font-family="Arial, sans-serif" font-size="18" fill="#233c55">• Router, pausa y decisión son controles;</text>
<text x="55" y="1045" font-family="Arial, sans-serif" font-size="18" fill="#233c55">  no son nodos extra de StateGraph.</text>
<text x="55" y="1072" font-family="Arial, sans-serif" font-size="18" fill="#233c55">• Un rechazo permite otro pedido.</text>
<text x="55" y="1099" font-family="Arial, sans-serif" font-size="18" fill="#233c55">• Estado en memoria del proceso.</text>
<rect x="55" y="1230" width="1380" height="105" rx="12" fill="#e7eef6"/>
<text x="75" y="1260" font-family="Arial, sans-serif" font-size="20" fill="#233c55" font-weight="700">Lectura de esta vista</text>
<text x="75" y="1291" font-family="Arial, sans-serif" font-size="18" fill="#233c55">Verde: retorno al supervisor. #21 conserva la topología; image_id y la aceptación multimodal siguen pendientes.</text>
<text x="75" y="1318" font-family="Arial, sans-serif" font-size="18" fill="#233c55">Topología exportada con nodos demo: no acredita modelo, RAG ni HTTP reales. Visión no tiene ruta propia.</text>
