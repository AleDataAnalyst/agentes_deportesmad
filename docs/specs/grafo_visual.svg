<text x="440" y="318" font-family="Arial, sans-serif" font-size="22" fill="#233c55" font-weight="700">AgentService · API común</text>
<text x="440" y="349" font-family="Arial, sans-serif" font-size="19" fill="#233c55">Conserva instancia, thread_id y plan vigente</text>
<text x="440" y="377" font-family="Arial, sans-serif" font-size="19" fill="#233c55">procesar_turno / consultar_estado / resolver_plan</text>
