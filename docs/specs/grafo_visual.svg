<text x="505" y="504" font-family="Arial, sans-serif" font-size="18" fill="#233c55">Recibe el proveedor construido por runtime</text>
<text x="505" y="531" font-family="Arial, sans-serif" font-size="18" fill="#233c55">Python valida rutas, fallback y MAX_ITER</text>
<text x="750" y="580" font-family="Arial, sans-serif" font-size="18" fill="#233c55" font-weight="700" text-anchor="middle">Router Python: valida destino y plan</text>
