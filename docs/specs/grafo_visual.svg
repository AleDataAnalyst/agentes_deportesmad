<text x="440" y="318" font-family="Arial, sans-serif" font-size="22" fill="#233c55" font-weight="700">Runtime · proveedor LLM del supervisor</text>
<text x="440" y="349" font-family="Arial, sans-serif" font-size="18" fill="#233c55">SUPERVISOR_MODE=llm → Google/Ollama + modelo explícito</text>
<text x="440" y="376" font-family="Arial, sans-serif" font-size="18" fill="#233c55">crear_proveedor_supervisor_real → crear_proveedor_rutas</text>
<text x="440" y="403" font-family="Arial, sans-serif" font-size="18" fill="#233c55">reglas → sin LLM; permite inyección manual de proveedor</text>
<text x="440" y="430" font-family="Arial, sans-serif" font-size="18" fill="#233c55">Propone JSON de ruta; sin tools ni aprobación automática</text>
