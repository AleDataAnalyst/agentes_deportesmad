<text x="845" y="1014" font-family="Arial, sans-serif" font-size="18" fill="#233c55">Checkpoint guardado · approved=None</text>
<text x="845" y="1041" font-family="Arial, sans-serif" font-size="18" fill="#233c55">pendiente_hitl=True · done=False</text>
