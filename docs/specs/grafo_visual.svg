<text x="55" y="850" font-family="Arial, sans-serif" font-size="18" fill="#157a80" font-weight="700">Retornos al supervisor</text>
<text x="55" y="877" font-family="Arial, sans-serif" font-size="17" fill="#233c55">Documental, instalaciones y síntesis</text>
<text x="55" y="903" font-family="Arial, sans-serif" font-size="17" fill="#233c55">devuelven el control; no hay paralelismo.</text>
