<text x="85" y="683" font-family="Arial, sans-serif" font-size="22" fill="#233c55" font-weight="700">Documental</text>
<text x="85" y="714" font-family="Arial, sans-serif" font-size="18" fill="#233c55">Adaptador → puerta pública diferida</text>
<text x="85" y="741" font-family="Arial, sans-serif" font-size="18" fill="#233c55">→ nodo documental → tool RAG</text>
<text x="85" y="768" font-family="Arial, sans-serif" font-size="18" fill="#233c55">Mejoras de #21: por integrar</text>
<text x="85" y="795" font-family="Arial, sans-serif" font-size="18" fill="#233c55">Índice y aceptación real pendientes</text>
<rect x="545" y="650" width="410" height="160" rx="14" fill="#e9f2fc" stroke="#6a9fcb" stroke-width="2"/>
<text x="565" y="683" font-family="Arial, sans-serif" font-size="22" fill="#233c55" font-weight="700">Instalaciones · conectado</text>
<text x="565" y="714" font-family="Arial, sans-serif" font-size="18" fill="#233c55">Nodo público de catálogo y avisos</text>
<text x="565" y="741" font-family="Arial, sans-serif" font-size="18" fill="#233c55">Fuentes, error o abstención</text>
<text x="565" y="768" font-family="Arial, sans-serif" font-size="18" fill="#233c55">Conserva fallback histórico</text>
<text x="565" y="795" font-family="Arial, sans-serif" font-size="18" fill="#233c55">Aceptación externa pendiente</text>
